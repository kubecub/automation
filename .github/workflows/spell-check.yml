name: Test repository spelling check
on:
    push:
        branches:
          - main
    pull_request:
        branches:
          - main
    workflow_dispatch:

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v2
    - name: Check spelling of the existing Markdown documents
      uses: crate-ci/typos@v1.50.2
      with:
        files: ./CONTRIBUTING.md ./README.md
